<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Radar Livros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <div class="admin-container">
    <div id="login-section">
      <h2>Acesso Restrito</h2>
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="admin-user" placeholder="Digite seu usuário">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="admin-pass" placeholder="••••••••">
      </div>
      <button class="btn-submit" onclick="tentarLogin()">Entrar</button>
      <div id="login-msg" class="erro" style="margin-top: 10px; text-align: center;"></div>
      <button class="btn-submit" style="background: #333; margin-top: 10px;" onclick="window.location.href='index.html'">Voltar ao Início</button>
    </div>

    <div id="dashboard-section" class="hidden">
      <h2>Painel Radar Livros (Pastas)</h2>
      
      <div class="form-group">
        <label>Título do Livro</label>
        <input type="text" id="book-title" placeholder="Ex: Orgulho e Preconceito">
      </div>

      <div class="form-group">
        <label>Nome do Autor</label>
        <input type="text" id="book-author" placeholder="Ex: Jane Austen">
      </div>
      
      <div class="form-group">
        <label>Gênero / Pasta</label>
        <select id="book-genre">
          <option value="Fantasia">Fantasia</option>
          <option value="Ficção Científica">Ficção Científica</option>
          <option value="Romance">Romance</option>
          <option value="Negócios">Negócios</option>
        </select>
      </div>

      <div class="form-group">
        <label>Caminho da Capa (Ex: capas/romance/capa.jpg)</label>
        <input type="text" id="book-cover-path" placeholder="capas/romance/orgulho.jpg">
      </div>

      <div class="form-group">
        <label>Caminho do PDF (Ex: livros/romance/livro.pdf)</label>
        <input type="text" id="book-pdf-path" placeholder="livros/romance/orgulho.pdf">
      </div>

      <button class="btn-submit" id="btn-upload" onclick="salvarLivroComPastas()">Cadastrar Livro</button>
      
      <div id="upload-status" style="margin-top: 15px; text-align: center; font-weight: bold; color: var(--text-muted);"></div>

      <button class="btn-submit" style="background: #444; margin-top: 20px;" onclick="window.location.href='index.html'">Acessar Biblioteca</button>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
