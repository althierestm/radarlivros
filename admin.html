<!-- ÁREA DO PAINEL -->
    <div id="dashboard-section" class="hidden">
      <h2>Painel Radar Livros</h2>
      
      <div class="form-group">
        <label>Título do Livro</label>
        <input type="text" id="book-title" placeholder="Ex: Orgulho e Preconceito">
      </div>

      <!-- NOVO CAMPO: AUTOR -->
      <div class="form-group">
        <label>Nome do Autor</label>
        <input type="text" id="book-author" placeholder="Ex: Jane Austen">
      </div>
      
      <div class="form-group">
        <label>Gênero</label>
        <select id="book-genre">
          <option value="Fantasia">Fantasia</option>
          <option value="Ficção Científica">Ficção Científica</option>
          <option value="Romance">Romance</option>
          <option value="Negócios">Negócios</option>
        </select>
      </div>

      <div class="form-group">
        <label>Capa do Livro (Imagem)</label>
        <input type="file" id="book-cover" accept="image/png, image/jpeg">
      </div>

      <div class="form-group">
        <label>Arquivo do Livro (PDF)</label>
        <input type="file" id="book-pdf" accept="application/pdf">
      </div>

      <button class="btn-submit" id="btn-upload" onclick="fazerUploadLivro()">Adicionar Livro</button>
      
      <!-- STATUS TEXTUAL E BARRA DE PROGRESSO -->
      <div id="upload-status" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
      
      <!-- ESTA É A BARRA DE PROGRESSO (Invisível por padrão) -->
      <div id="progress-container" style="display: none; width: 100%; background: #333; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
         <div id="progress-bar" style="width: 0%; height: 100%; background: #E50914; transition: width 0.3s ease;"></div>
      </div>

      <button class="btn-submit" style="background: #444; margin-top: 20px;" onclick="window.location.href='index.html'">Acessar Biblioteca</button>
    </div>
