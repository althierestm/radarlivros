<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lendo - Radar Livros</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  
  <style>
    body {
      background-color: #141414;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .reader-top-bar {
      position: absolute;
      top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
    }
    .btn-voltar, .btn-modo {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-voltar:hover, .btn-modo:hover {
      background: #007bff;
    }
    #carregando-msg {
      font-size: 18px;
      color: #aaa;
      text-align: center;
    }
    
    #book-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 82vh;
    }

    body.sepia-mode {
      background-color: #f4ecd8 !important;
      color: #5f4b32 !important;
    }
    body.sepia-mode .btn-voltar, body.sepia-mode .btn-modo {
      background: #d8c29d;
      color: #5f4b32;
    }
  </style>
</head>
<body>

  <!-- Elemento de áudio com o seu som do GitHub -->
  <audio id="som-virada" src="Folhagem.mp3" preload="auto"></audio>

  <div class="reader-top-bar">
    <button class="btn-voltar" onclick="window.location.href='index.html'">Voltar à Home</button>
    <button class="btn-modo" onclick="alternarSepia()">Modo Sepia</button>
    <span>Página: <span id="page-num">1</span></span>
  </div>

  <div id="carregando-msg">Preparando o livro e destravando as páginas...</div>

  <div id="book-viewport">
    <div id="book" style="display:none;"></div>
  </div>

  <div style="position: absolute; bottom: 15px; display: flex; gap: 15px; z-index: 10;">
    <button class="btn-voltar" onclick="paginaAnterior()">◀ Anterior</button>
    <button class="btn-voltar" onclick="proximaPagina()">Próxima ▶</button>
  </div>

  <script>
    const pdfUrl = localStorage.getItem('livro_atual_url');

    if (!pdfUrl) {
      alert("Nenhum livro selecionado!");
      window.location.href = 'index.html';
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pageFlip = null;
    const statusDiv = document.getElementById('carregando-msg');
    const bookContainer = document.getElementById('book');
    const somVirada = document.getElementById('som-virada');

    async function iniciarLeitor() {
      try {
        statusDiv.textContent = "Baixando o arquivo PDF...";
        
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdfDoc = await loadingTask.promise;
        const totalPaginas = pdfDoc.numPages;

        statusDiv.textContent = `Configurando ${totalPaginas} páginas...`;

        // Cria os blocos de páginas estruturados
        for (let i = 1; i <= totalPaginas; i++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.dataset.pageNum = i;
          pageDiv.innerHTML = `<div style="display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; height: 100%; background: #1e1e1e;">Carregando pág. ${i}...</div>`;
          bookContainer.appendChild(pageDiv);
        }

        statusDiv.style.display = 'none';
        bookContainer.style.display = 'block';

        // Inicializa o PageFlip sem travas na capa
        pageFlip = new St.PageFlip(bookContainer, {
          width: 420,
          height: 600,
          size: "fixed",
          minWidth: 280,
          maxWidth: 550,
          minHeight: 400,
          maxHeight: 750,
          maxShadowOpacity: 0.3,
          showCover: false, // Desativado para evitar travamento na primeira página
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        // Função otimizada para renderizar o PDF em cada página sob demanda
        async function renderizarPaginaNoElemento(num) {
          const pageDiv = bookContainer.children[num - 1];
          if (!pageDiv || pageDiv.dataset.rendered === 'true') return;

          try {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 1.2 });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            pageDiv.innerHTML = '';
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.85);
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            
            pageDiv.appendChild(img);
            pageDiv.dataset.rendered = 'true';
          } catch (err) {
            console.error("Erro ao renderizar página " + num, err);
          }
        }

        // Pré-carrega as primeiras páginas para destravar a leitura imediatamente
        await renderizarPaginaNoElemento(1);
        await renderizarPaginaNoElemento(2);
        await renderizarPaginaNoElemento(3);
        await renderizarPaginaNoElemento(4);

        // Evento de virada de página com som real do GitHub
        pageFlip.on('flip', async (e) => {
          const paginaAtual = e.data + 1;
          document.getElementById('page-num').textContent = paginaAtual;
          
          // Toca o arquivo Folhagem.mp3
          if (somVirada) {
            somVirada.currentTime = 0;
            somVirada.play().catch(() => {});
          }

          // Carrega as próximas páginas em background conforme o usuário avança
          await renderizarPaginaNoElemento(paginaAtual);
          if (paginaAtual + 1 <= totalPaginas) renderizarPaginaNoElemento(paginaAtual + 1);
          if (paginaAtual + 2 <= totalPaginas) renderizarPaginaNoElemento(paginaAtual + 2);
        });

      } catch (error) {
        console.error("Erro crítico ao carregar o leitor:", error);
        statusDiv.innerHTML = '<span style="color: #f44336;">Erro ao abrir o PDF. Verifique o console (F12).</span>';
      }
    }

    window.proximaPagina = function() {
      if (pageFlip) pageFlip.flipNext();
    }

    window.paginaAnterior = function() {
      if (pageFlip) pageFlip.flipPrev();
    }

    window.alternarSepia = function() {
      document.body.classList.toggle('sepia-mode');
    }

    iniciarLeitor();
  </script>
</body>
</html>
