<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lendo - Radar Livros</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  
  <style>
    body {
      background-color: #141414;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .reader-top-bar {
      position: absolute;
      top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
    }
    .btn-voltar, .btn-modo {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-voltar:hover, .btn-modo:hover {
      background: #007bff;
    }
    #carregando-msg {
      font-size: 18px;
      color: #aaa;
      text-align: center;
    }
    
    /* Contêiner Responsivo do Livro 3D */
    #book-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 85vh;
    }

    /* Modo Sepia */
    body.sepia-mode {
      background-color: #f4ecd8 !important;
      color: #5f4b32 !important;
    }
    body.sepia-mode .btn-voltar, body.sepia-mode .btn-modo {
      background: #d8c29d;
      color: #5f4b32;
    }
  </style>
</head>
<body>

  <div class="reader-top-bar">
    <button class="btn-voltar" onclick="window.location.href='index.html'">Voltar à Home</button>
    <button class="btn-modo" onclick="alternarSepia()">Modo Sepia</button>
    <span>Página: <span id="page-num">1</span></span>
  </div>

  <div id="carregando-msg">Preparando as páginas...</div>

  <!-- Viewport Responsivo -->
  <div id="book-viewport">
    <div id="book" style="display:none;"></div>
  </div>

  <div style="position: absolute; bottom: 15px; display: flex; gap: 15px; z-index: 10;">
    <button class="btn-voltar" onclick="paginaAnterior()">◀ Anterior</button>
    <button class="btn-voltar" onclick="proximaPagina()">Próxima ▶</button>
  </div>

  <script>
    const pdfUrl = localStorage.getItem('livro_atual_url');

    if (!pdfUrl) {
      alert("Nenhum livro selecionado!");
      window.location.href = 'index.html';
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pageFlip = null;
    const statusDiv = document.getElementById('carregando-msg');
    const bookContainer = document.getElementById('book');

    // Efeito sonoro sintetizado de virada de página (sem link externo)
    function tocarSomPagina() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(120, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        // Ignora se o navegador bloquear autoplay de áudio antes do clique
      }
    }

    async function iniciarLeitor() {
      try {
        statusDiv.textContent = "Baixando o livro...";
        
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdfDoc = await loadingTask.promise;
        const totalPaginas = pdfDoc.numPages;

        statusDiv.textContent = `Preparando ${totalPaginas} páginas...`;

        for (let i = 1; i <= totalPaginas; i++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.dataset.pageNum = i;
          pageDiv.innerHTML = `<div style="display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; height: 100%;">Carregando pág. ${i}...</div>`;
          bookContainer.appendChild(pageDiv);
        }

        statusDiv.style.display = 'none';
        bookContainer.style.display = 'block';

        // Configuração Responsiva e Inteligente do StPageFlip
        pageFlip = new St.PageFlip(bookContainer, {
          width: 450,
          height: 620,
          size: "fixed",
          minWidth: 280,
          maxWidth: 600,
          minHeight: 400,
          maxHeight: 800,
          maxShadowOpacity: 0.4,
          showCover: true, // Capa isolada na primeira página
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        async function renderizarPaginaNoElemento(num) {
          const pageDiv = bookContainer.children[num - 1];
          if (!pageDiv || pageDiv.dataset.rendered === 'true') return;

          try {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 1.1 });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            pageDiv.innerHTML = '';
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.85);
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            
            pageDiv.appendChild(img);
            pageDiv.dataset.rendered = 'true';
          } catch (err) {
            console.error("Erro ao renderizar página " + num, err);
          }
        }

        // Renderiza capa e páginas iniciais
        await renderizarPaginaNoElemento(1);
        await renderizarPaginaNoElemento(2);
        await renderizarPaginaNoElemento(3);

        pageFlip.on('flip', async (e) => {
          const paginaAtual = e.data + 1;
          document.getElementById('page-num').textContent = paginaAtual;
          
          tocarSomPagina(); // Toca o som ao passar

          // Renderiza a página atual e as vizinhas sob demanda
          await renderizarPaginaNoElemento(paginaAtual);
          if (paginaAtual + 1 <= totalPaginas) await renderizarPaginaNoElemento(paginaAtual + 1);
          if (paginaAtual + 2 <= totalPaginas) await renderizarPaginaNoElemento(paginaAtual + 2);
        });

      } catch (error) {
        console.error("Erro crítico ao carregar o leitor:", error);
        statusDiv.innerHTML = '<span style="color: #f44336;">Erro ao abrir o PDF. Verifique o link no GitHub (F12).</span>';
      }
    }

    window.proximaPagina = function() {
      if (pageFlip) pageFlip.flipNext();
    }

    window.paginaAnterior = function() {
      if (pageFlip) pageFlip.flipPrev();
    }

    window.alternarSepia = function() {
      document.body.classList.toggle('sepia-mode');
    }

    iniciarLeitor();
  </script>
</body>
</html>
